<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>

    <h1>Student Table</h1>

    <table border="1">
        <caption>Student Details</caption>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>BCA</td>
        </tr>

        <tr>
            <td>Anita</td>
            <td>21</td>
            <td>MCA</td>
        </tr>

        <tr>
            <td>Rohit</td>
            <td>19</td>
            <td>B.Tech</td>
        </tr>

    </table>

</body>
</html>
